[workspace]
resolver = "2"
members = [
    "crates/cbp-core",
    "crates/cbp-transforms",
    "crates/cbp",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["GoldSrc Architecture Team"]
repository = "https://github.com/ulquiorracode/compact-binary-protocol"

[workspace.dependencies]
cbp-core = { path = "crates/cbp-core", default-features = false }
cbp-transforms = { path = "crates/cbp-transforms", default-features = false }
cbp = { path = "crates/cbp", default-features = false }

stitch-core = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "dev", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
criterion = { version = "0.8", default-features = false }
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }
rmp-serde = "1.3"
bincode = "1.3"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
