[workspace]
resolver = "2"
members = [
    "crates/stitch-data-core",
    "crates/stitch-data-transforms",
    "crates/stitch-data-derive",
    "crates/stitch-data",
    "crates/stitch-data-fuzz",
    "benches",
]
exclude = [
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Stitch Contributors", "GoldSrc Architecture Team"]
repository = "https://github.com/stitch-rs/stitch-data"

[workspace.dependencies]
stitch-data-core = { path = "crates/stitch-data-core", default-features = false }
stitch-data-transforms = { path = "crates/stitch-data-transforms", default-features = false }
stitch-data-derive = { path = "crates/stitch-data-derive" }
stitch-data = { path = "crates/stitch-data", default-features = false }

stitch-core = { git = "https://github.com/stitch-rs/stitch-framework.git", branch = "main", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
criterion = { version = "0.8", default-features = false }
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }
rmp-serde = "1.3"
bincode = "1.3"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
syn = { version = "2.0", features = ["full", "derive"] }
quote = "1.0"
proc-macro2 = "1.0"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
