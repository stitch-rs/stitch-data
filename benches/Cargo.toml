[package]
name = "cbp-benches"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
cbp = { workspace = true, features = ["std", "zero-copy", "derive"] }
criterion = { workspace = true, features = ["html_reports"] }
prost = { workspace = true }
rmp-serde = { workspace = true }
bincode = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }

[lib]
name = "cbp_benches"
path = "src/lib.rs"

[[bin]]
name = "cbp-scoreboard"
path = "src/main.rs"

[[bench]]
name = "primitives"
path = "benches/primitives.rs"
harness = false

[[bench]]
name = "transforms"
path = "benches/transforms.rs"
harness = false

[[bench]]
name = "pipeline"
path = "benches/pipeline.rs"
harness = false

[[bench]]
name = "framing"
path = "benches/framing.rs"
harness = false

[[bench]]
name = "cross_serializer"
path = "benches/cross_serializer.rs"
harness = false
