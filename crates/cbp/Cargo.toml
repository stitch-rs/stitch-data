[package]
name = "cbp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Compact Binary Protocol (CBP) high-performance facade"

[dependencies]
cbp-core = { workspace = true }
cbp-transforms = { workspace = true }

[features]
default = ["std"]
std = ["cbp-core/std", "cbp-transforms/std"]
alloc = ["cbp-core/alloc", "cbp-transforms/alloc"]
zero-copy = ["cbp-core/zero-copy"]
